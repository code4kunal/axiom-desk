[project]
name = "axiom-desk"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["axiom-core", "axiom-api", "axiom-chartmath", "axiom-data"]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "pyright>=1.1.380",
]

[tool.uv]
package = false
# click 8.5.1 (2026-11-06) is under the two-week dependency age rule; drop once it ages in.
exclude-newer-package = { click = "2026-10-30T00:00:00Z" }

[tool.uv.sources]
axiom-core = { workspace = true }
axiom-api = { workspace = true }
axiom-chartmath = { workspace = true }
axiom-data = { workspace = true }

[tool.uv.workspace]
members = ["packages/core", "packages/chartmath", "packages/data", "services/api"]

[tool.pytest.ini_options]
testpaths = ["packages", "tools", "services"]
addopts = "--strict-markers"
markers = [
  "parity: screen, command bar and agent return the same result",
  "golden: reproduces quant-signed golden numbers",
  "isolation: needs a host with microVM support",
]
