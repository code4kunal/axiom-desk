[project]
name = "axiom-desk"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["axiom-core", "axiom-api"]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "httpx2>=2.16",
]

[tool.uv]
package = false

[tool.uv.sources]
axiom-core = { workspace = true }
axiom-api = { workspace = true }

[tool.uv.workspace]
members = ["packages/core", "services/api"]

[tool.pytest.ini_options]
testpaths = ["packages", "tools", "services"]
addopts = "--strict-markers"
markers = [
  "parity: screen, command bar and agent return the same result",
  "golden: reproduces quant-signed golden numbers",
  "isolation: needs a host with microVM support",
]
