[project]
name = "axiom-api"
version = "0.1.0"
description = "Axiom Desk HTTP API: serves every screen- and command-bound registry capability."
requires-python = ">=3.12,<3.13"
dependencies = [
    "axiom-core",
    "fastapi>=0.115",
    "httpx2>=2.16",
    "pyjwt[crypto]==2.15.1",
    "uvicorn==0.54.0",
]

[tool.uv.sources]
axiom-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axiom_api"]
